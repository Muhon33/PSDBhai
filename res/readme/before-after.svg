<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Before: every PSD shows the same icon. After PSDGlance: every PSD shows its real picture.">
  <defs>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="t6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#7F1D1D"/></linearGradient>
  </defs>
  <style>
    .label { font-family: Segoe UI, Inter, Helvetica, Arial, sans-serif; font-size: 15px; fill: #CBD5E1; }
    .head { font-family: Segoe UI, Inter, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 700; }
  </style>
  <rect width="1200" height="430" rx="24" fill="#0F172A"/>

  <!-- Before -->
  <text x="290" y="56" text-anchor="middle" class="head" fill="#94A3B8">Before</text>
  <g>
    <g transform="translate(70 90)"><path d="M0 0h70l30 30v100H0z" fill="#334155"/><path d="M70 0v30h30" fill="#475569"/><text x="50" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">PSD</text></g>
    <text x="120" y="250" text-anchor="middle" class="label">cover-final.psd</text>
    <g transform="translate(240 90)"><path d="M0 0h70l30 30v100H0z" fill="#334155"/><path d="M70 0v30h30" fill="#475569"/><text x="50" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">PSD</text></g>
    <text x="290" y="250" text-anchor="middle" class="label">thumbnail-v2.psd</text>
    <g transform="translate(410 90)"><path d="M0 0h70l30 30v100H0z" fill="#334155"/><path d="M70 0v30h30" fill="#475569"/><text x="50" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#94A3B8">PSB</text></g>
    <text x="460" y="250" text-anchor="middle" class="label">poster-large.psb</text>
    <text x="290" y="320" text-anchor="middle" class="label" fill="#94A3B8">Every file looks the same.</text>
    <text x="290" y="344" text-anchor="middle" class="label" fill="#94A3B8">You open Photoshop to find the right one.</text>
  </g>

  <!-- Arrow -->
  <path d="M575 180h36" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M606 164l20 16-20 16" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- After -->
  <text x="910" y="56" text-anchor="middle" class="head" fill="#7DD3FC">After PSDGlance</text>
  <g>
    <g transform="translate(670 90)">
      <rect width="150" height="130" rx="10" fill="url(#t1)"/>
      <circle cx="112" cy="36" r="16" fill="#FFF7ED" fill-opacity="0.9"/>
      <rect x="16" y="78" width="88" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="16" y="100" width="56" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
    </g>
    <text x="745" y="250" text-anchor="middle" class="label">cover-final.psd</text>
    <g transform="translate(835 90)">
      <rect width="150" height="130" rx="10" fill="url(#t2)"/>
      <polygon points="0,130 55,60 110,130" fill="#1E3A8A" fill-opacity="0.8"/>
      <polygon points="60,130 105,78 150,130 150,130" fill="#0C4A6E" fill-opacity="0.8"/>
      <circle cx="118" cy="34" r="14" fill="#FDE68A"/>
    </g>
    <text x="910" y="250" text-anchor="middle" class="label">thumbnail-v2.psd</text>
    <g transform="translate(1000 90)">
      <rect width="150" height="130" rx="10" fill="url(#t5)"/>
      <rect x="20" y="20" width="110" height="64" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
      <text x="75" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">SALE</text>
      <rect x="40" y="98" width="70" height="14" rx="7" fill="#FDE047"/>
    </g>
    <text x="1075" y="250" text-anchor="middle" class="label">poster-large.psb</text>
    <text x="910" y="320" text-anchor="middle" class="label" fill="#E2E8F0">Every file shows its real picture.</text>
    <text x="910" y="344" text-anchor="middle" class="label" fill="#E2E8F0">Find the right design at a glance.</text>
  </g>
  <text x="600" y="404" text-anchor="middle" class="label" fill="#64748B">Illustration</text>
</svg>
