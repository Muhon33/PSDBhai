<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="PSDBhai: see inside your Photoshop files right in Windows File Explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#13285A"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="104" y="112" width="132" height="108" rx="12"/></clipPath>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>

  <!-- App icon -->
  <rect x="80" y="84" width="180" height="180" rx="40" fill="#13203A" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="104" y="112" width="132" height="108" rx="12" fill="#ECF4FF"/>
  <g clip-path="url(#card)">
    <circle cx="198" cy="140" r="13" fill="#FBBF24"/>
    <polygon points="140,220 192,160 248,220" fill="#0EA5E9"/>
    <polygon points="98,220 146,150 196,220" fill="#2563EB"/>
  </g>

  <text x="300" y="168" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)">PSDBhai</text>
  <text x="304" y="218" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#DBEAFE">See inside your Photoshop files, right in File Explorer.</text>

  <!-- Floating preview cards -->
  <g transform="translate(1000 60) rotate(8)">
    <rect width="140" height="110" rx="12" fill="#F97316"/>
    <rect width="140" height="110" rx="12" fill="#DB2777" fill-opacity="0.55"/>
    <circle cx="104" cy="32" r="14" fill="#FFF7ED"/>
    <rect x="16" y="66" width="80" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="16" y="86" width="50" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>
  <g transform="translate(965 190) rotate(-6)">
    <rect width="150" height="115" rx="12" fill="#0EA5E9"/>
    <polygon points="0,115 58,52 116,115" fill="#1E3A8A"/>
    <polygon points="62,115 108,66 150,115" fill="#0C4A6E"/>
    <circle cx="120" cy="30" r="13" fill="#FDE68A"/>
  </g>
  <g transform="translate(1088 180) rotate(10)">
    <rect width="92" height="120" rx="12" fill="#7C3AED"/>
    <text x="46" y="68" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">SALE</text>
    <rect x="22" y="84" width="48" height="11" rx="5.5" fill="#FDE047"/>
  </g>

  <!-- Chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="304" y="252" width="104" height="40" rx="20" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E"/>
    <text x="356" y="278" text-anchor="middle" fill="#BBF7D0">Free</text>
    <rect x="422" y="252" width="150" height="40" rx="20" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8"/>
    <text x="497" y="278" text-anchor="middle" fill="#BAE6FD">PSD + PSB</text>
    <rect x="586" y="252" width="132" height="40" rx="20" fill="#A78BFA" fill-opacity="0.18" stroke="#A78BFA"/>
    <text x="652" y="278" text-anchor="middle" fill="#DDD6FE">Only 2 MB</text>
    <rect x="732" y="252" width="206" height="40" rx="20" fill="#FBBF24" fill-opacity="0.18" stroke="#FBBF24"/>
    <text x="835" y="278" text-anchor="middle" fill="#FDE68A">Windows 10 &amp; 11</text>
  </g>
</svg>
