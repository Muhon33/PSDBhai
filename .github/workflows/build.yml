# Builds x64 + ARM64, runs the test suite and packages the installer on every
# push. Pushing a tag like v1.0.1 also publishes a GitHub Release with the
# installer attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases for tags

env:
  LLVM_MINGW_VERSION: '20261020'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache llvm-mingw
        id: cache
        uses: actions/cache@v4
        with:
          path: C:\llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Download llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          tar -xf $zip -C C:\
          Rename-Item "C:\$name" C:\llvm-mingw

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Toolchain C:\llvm-mingw -Tests -Installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PSDBhai-Setup
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
