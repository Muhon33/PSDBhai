# Builds x64 + ARM64, runs the tests and packages the installer on every push.
#
# Pushing a version tag (v1.2.3, matching the VERSION file) also publishes a
# GitHub Release. Once SignPath is set up (repository variable
# SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN, see docs/signing.md),
# tagged builds are code-signed first: the program files, then the installer.
# Each signing request waits for manual approval in SignPath.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publish releases for tags
  actions: read    # lets SignPath verify which workflow run produced the files

env:
  LLVM_MINGW_VERSION: '20261020'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($version)"
          }

      - name: Download llvm-mingw
        shell: pwsh
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          tar -xf $zip -C C:\
          "LLVM_MINGW=C:\$name" >> $env:GITHUB_ENV

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Tests

      # ---- Code signing (version tags only, once SignPath is configured) ----

      - name: Upload unsigned program files
        id: upload-binaries
        if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: program-files-unsigned
          path: |
            bin/x64/PSDBhai.dll
            bin/x64/PSDBhai.exe
            bin/arm64/PSDBhai.dll
            bin/arm64/PSDBhai.exe

      - name: Sign program files (SignPath)
        if: steps.upload-binaries.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'psdbhai' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400  # time to approve in SignPath
          output-artifact-directory: bin  # signed files replace the unsigned ones
          parameters: |
            version: "${{ env.VERSION }}"

      # ---- Installer ----

      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -Installer -PackageOnly

      - name: Upload installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: PSDBhai-Setup-${{ env.VERSION }}${{ steps.upload-binaries.outcome == 'success' && '-unsigned' || '' }}
          path: dist/PSDBhai-Setup-${{ env.VERSION }}.exe

      - name: Sign installer (SignPath)
        if: steps.upload-binaries.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'psdbhai' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: dist-signed
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Upload signed installer
        if: steps.upload-binaries.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: PSDBhai-Setup-${{ env.VERSION }}
          path: dist-signed/PSDBhai-Setup-${{ env.VERSION }}.exe

      # ---- Release ----

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signed = Test-Path dist-signed
          $setup = if ($signed) { "dist-signed\PSDBhai-Setup-$env:VERSION.exe" } else { "dist\PSDBhai-Setup-$env:VERSION.exe" }
          $policy = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY#code-signing-policy"
          $signing = if ($signed) { "Free code signing provided by SignPath.io, certificate by SignPath Foundation." } else { "This build is not code-signed." }
          $notes = @"
          Shows thumbnails for Photoshop PSD and PSB files in Windows File Explorer.

          **Install:** download PSDBhai-Setup-$env:VERSION.exe below, double-click it, accept the license, click Install. No admin password needed. Windows 10 and 11, Intel/AMD and ARM PCs.

          **Uninstall:** Settings > Apps > Installed apps > PSDBhai > Uninstall.

          $signing [Code signing policy]($policy)
          "@
          # Also attach a copy with a fixed name, so this link always gets the newest version:
          # https://github.com/<owner>/<repo>/releases/latest/download/PSDBhai-Setup.exe
          Copy-Item $setup "$env:RUNNER_TEMP\PSDBhai-Setup.exe"
          gh release create $env:GITHUB_REF_NAME $setup "$env:RUNNER_TEMP\PSDBhai-Setup.exe" --title "PSDBhai $env:VERSION" --notes $notes
